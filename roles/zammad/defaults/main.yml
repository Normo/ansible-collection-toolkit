---
zammad_version: "7.2.1"
zammad_release_channel: "stable"
zammad_repo_url: "https://go.packager.io/srv/deb/zammad/zammad/{{ zammad_release_channel }}/{{ ansible_facts.distribution | lower }}"
zammad_domain_name: "{{ ansible_facts.fqdn }}"

zammad_nginx_config_path: "/etc/nginx/sites-available/zammad.conf"
zammad_ssl_cert_path: "/etc/ssl/certs/zammad_cert.pem"
zammad_ssl_key_path: "/etc/ssl/private/zammad_key.pem"
# Do not display sensitive changes in diffs by default
zammad_hide_sensitive_changes: true

zammad_nginx_additional_server_configs: []
zammad_nginx_server_tokens: "off"
zammad_nginx_additional_locations: []
# Clear client-supplied SSO identity headers before proxying to Zammad.
# Zammad 7.2.3 fixed an account takeover via client-controlled identity in SSO
# authentication (GHSA-4749-hj8h-f4jf) by clearing these headers.
# Entries are rendered verbatim into the Nginx "location" blocks.
# In an SSO setup, keep the header set by the reverse proxy and clear the other.
zammad_nginx_sso_identity_headers:
  - 'proxy_set_header X-Forwarded-User "";'
  - 'proxy_set_header Remote-User "";'

zammad_force_es_searchindex_rebuild: false

zammad_elasticsearch_url: "http://localhost:9200"
...
